AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Student Hub Backend Lambda Function

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_ENV: production

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  MongoDbUri:
    Type: String
    Description: MongoDB connection string
    NoEcho: true
  
  CorsOrigin:
    Type: String
    Default: '*'
    Description: CORS allowed origins (comma-separated)
  
  JwtSecret:
    Type: String
    Description: JWT secret key for token signing
    NoEcho: true

  AdminToken:
    Type: String
    Description: Admin token for admin access
    NoEcho: true

  S3BucketName:
    Type: String
    Description: S3 bucket name for file uploads
    
  S3AccessKeyId:
    Type: String
    Description: S3 access key ID
    NoEcho: true
    
  S3SecretAccessKey:
    Type: String
    Description: S3 secret access key
    NoEcho: true
    
  S3Region:
    Type: String
    Default: us-east-1
    Description: S3 bucket region

  AwsAdminAccessKeyId:
    Type: String
    Description: AWS admin access key ID for provisioning
    NoEcho: true

  AwsAdminSecretAccessKey:
    Type: String
    Description: AWS admin secret access key for provisioning
    NoEcho: true

  CustomAwsRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for admin operations

  AwsS3Bucket:
    Type: String
    Description: AWS S3 bucket for secrets
    
  SmtpHost:
    Type: String
    Default: smtp.gmail.com
    Description: SMTP host for email notifications
    
  SmtpPort:
    Type: String
    Default: "587"
    Description: SMTP port for email notifications
    
  SmtpEncryption:
    Type: String
    Default: STARTTLS
    Description: SMTP encryption method
    
  SmtpUser:
    Type: String
    Description: SMTP username for email notifications
    NoEcho: true
    
  SmtpPass:
    Type: String
    Description: SMTP password for email notifications
    NoEcho: true

  DiscordBotToken:
    Type: String
    Description: Discord bot token
    NoEcho: true
    
  DiscordGuildId:
    Type: String
    Description: Discord guild (server) ID
    NoEcho: true
    
  DiscordChannelId:
    Type: String
    Description: Discord channel ID for invites
    NoEcho: true
    
  AwsCredEncryptionKey:
    Type: String
    Description: AWS credentials encryption key
    NoEcho: true

  AwsHubEventThumbnails:
    Type: String
    Description: S3 bucket name for event thumbnail uploads
    Default: aws-student-hub-event-thumbnails

Resources:
  StudentHubApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'student-hub-api-${Environment}'
      CodeUri: ./
      Handler: lambda.handler
      Runtime: nodejs20.x
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt StudentHubApiRole.Arn
      Description: "Student Hub API v2 - Complete Environment Variables"
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          ADMIN_TOKEN: !Ref AdminToken
          JWT_SECRET: !Ref JwtSecret
          PORT: "5001"
          NODE_ENV: !Ref Environment
          CORS_ORIGIN: !Ref CorsOrigin
          S3_ACCESS_KEY_ID: !Ref S3AccessKeyId
          S3_SECRET_ACCESS_KEY: !Ref S3SecretAccessKey
          S3_REGION: !Ref S3Region
          S3_BUCKET_NAME: !Ref S3BucketName
          AWS_ADMIN_ACCESS_KEY_ID: !Ref AwsAdminAccessKeyId
          AWS_ADMIN_SECRET_ACCESS_KEY: !Ref AwsAdminSecretAccessKey
          CUSTOM_AWS_REGION: !Ref CustomAwsRegion
          AWS_S3_BUCKET: !Ref AwsS3Bucket
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_ENCRYPTION: !Ref SmtpEncryption
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
          DISCORD_BOT_TOKEN: !Ref DiscordBotToken
          DISCORD_GUILD_ID: !Ref DiscordGuildId
          DISCORD_CHANNEL_ID: !Ref DiscordChannelId
          AWS_CRED_ENCRYPTION_KEY: !Ref AwsCredEncryptionKey
          AWS_HUB_EVENT_THUMBNAILS: !Ref AwsHubEventThumbnails
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref StudentHubApiGateway
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref StudentHubApiGateway

  # Scheduled Email Queue Processor
  EmailQueueProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'student-hub-email-queue-${Environment}'
      CodeUri: ./
      Handler: lambda.processEmailQueueHandler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt StudentHubApiRole.Arn
      Description: "Scheduled email queue processor - retries failed emails"
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          NODE_ENV: !Ref Environment
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_ENCRYPTION: !Ref SmtpEncryption
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Process email queue every 5 minutes
            Enabled: true

  StudentHubApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'student-hub-api-gateway-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowCredentials: false
        MaxAge: "'600'"
      BinaryMediaTypes:
        - 'multipart/form-data'
        - 'image/*'
        - 'application/octet-stream'
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              Access-Control-Allow-Credentials: "'false'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              Access-Control-Allow-Credentials: "'false'"

  # Lambda execution role
  StudentHubApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'StudentHubApiRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource: '*'

Outputs:
  StudentHubApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${StudentHubApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
    Export:
      Name: !Sub '${AWS::StackName}-api-url'
  
  StudentHubApiFunction:
    Description: Lambda Function ARN
    Value: !GetAtt StudentHubApi.Arn
    Export:
      Name: !Sub '${AWS::StackName}-function-arn'
  
  EmailQueueProcessorFunction:
    Description: Email Queue Processor Lambda Function ARN
    Value: !GetAtt EmailQueueProcessor.Arn
    Export:
      Name: !Sub '${AWS::StackName}-email-queue-function-arn'