      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref StudentHubApiGateway
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref StudentHubApiGateway

  StudentHubApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'student-hub-api-gateway-${Environment}'
      StageName: !Ref Environment
      BinaryMediaTypes:
        - 'multipart/form-data'
        - 'image/*'
        - 'application/octet-stream'

  # Lambda execution role
  StudentHubApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'StudentHubApiRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource: '*'

Outputs:
  StudentHubApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${StudentHubApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
    Export:
      Name: !Sub '${AWS::StackName}-api-url'
  
  StudentHubApiFunction:
    Description: Lambda Function ARN
    Value: !GetAtt StudentHubApi.Arn
    Export:
      Name: !Sub '${AWS::StackName}-function-arn'