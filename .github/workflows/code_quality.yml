name: Code Quality
on: [push, pull_request]
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install frontend deps
        run: cd frontend && bun install --frozen-lockfile

      - name: Install backend deps
        run: cd backend && bun install --frozen-lockfile --ignore-scripts

      - name: Install docs deps
        run: cd docs-site && bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint frontend
        run: cd frontend && bun run lint

      - name: Lint backend
        run: cd backend && bun run lint

      - name: Check docs types
        run: cd docs-site && bun run typecheck

      - name: Check frontend build
        run: cd frontend && bun run build

      - name: Check docs build
        run: cd docs-site && bun run build
